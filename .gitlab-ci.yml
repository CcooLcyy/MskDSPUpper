workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
    - when: never

stages: [build]

upper-ci:
  stage: build
  tags: [windows, amd64, shell]
  timeout: 2h
  resource_group: upper-ci-publish
  interruptible: false
  environment:
    name: ci
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "20"
    # 默认关闭；pipeline.ps1 在环境导入后仅对 verify 显式开启，package 继续关闭。
    CARGO_INCREMENTAL: "0"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUTF8: "1"
    PYTHONIOENCODING: "utf-8"
  before_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - '$ErrorActionPreference = "Stop"'
    - python -B scripts/gitlab/init_device_proto.py
    - if ($LASTEXITCODE -ne 0) { throw '初始化设备协议子模块失败' }
    # 已有工作区可能仍保留属性变更前的 CRLF，按当前提交重新检出验签输入。
    - git restore --source=HEAD --worktree -- src-tauri/testdata/updater/fixture.bin
    - if ($LASTEXITCODE -ne 0) { throw '恢复验签夹具原始字节失败' }
  script:
    - ./scripts/gitlab/pipeline.ps1 -Stage verify
    - ./scripts/gitlab/pipeline.ps1 -Stage package
    - ./scripts/gitlab/pipeline.ps1 -Stage publish
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/platform/
      - package/metadata/
      - package/logs/
