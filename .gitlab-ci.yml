workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
      variables:
        UPPER_RELEASE_CHANNEL: ci
    - if: '$CI_COMMIT_BRANCH =~ /^release\/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        UPPER_RELEASE_CHANNEL: ci
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_PIPELINE_SOURCE =~ /^(push|web)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        UPPER_RELEASE_CHANNEL: stable
    - when: never

stages: [build, publish]

.upper-windows:
  tags: [windows, amd64, shell]
  timeout: 2h
  # 所有通道共用同一 Cargo 缓存，验证、打包及回收必须跨通道互斥。
  resource_group: upper-windows-cargo
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "20"
    # 检出时仅保留依赖目录；缓存脚本按身份与完整性决定复用或重装。
    GIT_CLEAN_FLAGS: "-ffdx -e /node_modules/"
    # 默认关闭；GitLab CI 脚本在环境导入后为 verify/package 显式开启。
    CARGO_INCREMENTAL: "0"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUTF8: "1"
    PYTHONIOENCODING: "utf-8"
  before_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - '$ErrorActionPreference = "Stop"'
    - python -B scripts/gitlab/init_device_proto.py
    - if ($LASTEXITCODE -ne 0) { throw '初始化设备协议子模块失败' }
    # 已有工作区可能仍保留属性变更前的 CRLF，按当前提交重新检出验签输入。
    - git restore --source=HEAD --worktree -- src-tauri/testdata/updater/fixture.bin
    - if ($LASTEXITCODE -ne 0) { throw '恢复验签夹具原始字节失败' }

upper-ci:
  extends: .upper-windows
  stage: build
  interruptible: true
  environment:
    name: ci
    action: prepare
  script:
    - Write-Host "上位机 $env:UPPER_RELEASE_CHANNEL 校验与打包作业开始，允许新提交自动取消"
    - ./scripts/gitlab/pipeline.ps1 -Stage verify
    - ./scripts/gitlab/pipeline.ps1 -Stage package
  after_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - ./scripts/gitlab/pipeline.ps1 -Stage cache-finish
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/platform/
      - package/metadata/
      - package/logs/

upper-publish:
  extends: .upper-windows
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - when: never
  interruptible: false
  environment:
    name: ci
  needs:
    - job: upper-ci
      artifacts: true
  before_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - '$ErrorActionPreference = "Stop"'
  script:
    - Write-Host "上位机 $env:UPPER_RELEASE_CHANNEL 发布作业开始，完成前不自动取消"
    - ./scripts/gitlab/pipeline.ps1 -Stage publish
