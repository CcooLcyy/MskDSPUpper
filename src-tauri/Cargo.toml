[package]
name = "mskdsp-upper"
version = "0.6.0"
description = "MskDSP 上位机"
authors = ["MskDSP Team"]
edition = "2021"

[lib]
name = "mskdsp_upper_lib"
# 上位机只面向 Windows 桌面产物（NSIS 安装包），后续也不会构建移动端，
# 因此只保留 rlib，去掉 Tauri 模板默认的 cdylib/staticlib 两种 crate-type：
# 否则 cargo 会把同一份代码按三种 crate-type 各编译一遍，且 sccache 无法缓存，
# 每次 CI/Beta/Stable 构建都要多花约 2 分钟。若将来需要移动端或对外 FFI 产物，再补回。
crate-type = ["lib"]

[[bin]]
name = "mskdsp-upper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.13"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls-no-provider"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
russh = { version = "0.62.2", default-features = false, features = ["ring"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
