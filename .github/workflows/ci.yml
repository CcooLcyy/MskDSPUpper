name: Upper CI and Platform Release

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.2'
  PYTHON_VERSION: '3.13'
  RUST_TARGET: x86_64-pc-windows-msvc
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'

jobs:
  verify:
    name: 验证
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: upper-verify-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 校验发布来源
        if: github.event_name != 'pull_request'
        run: |
          python -B scripts/gitlab/release_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python -B scripts/gitlab/verify_stable_source.py --repository origin --tag $env:GITHUB_REF_NAME --sha $env:GITHUB_SHA
          }

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: 配置 protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 缓存 Rust 依赖和产物
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: upper-${{ env.RUST_TARGET }}-verify
          workspaces: src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: 记录 Rust 缓存命中
        run: Write-Host "Rust 缓存命中=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: 恢复签名测试夹具的原始字节
        run: git restore --source=HEAD --worktree -- src-tauri/testdata/updater/fixture.bin

      - name: 安装前端依赖
        run: npm ci

      - name: 验证工作流脚本
        run: npm run test:workflow

      - name: 运行离线业务测试
        run: npm run test:offline

      - name: 检查前端代码
        run: npm run lint

      - name: 检查前端类型并构建
        run: npm run build

      - name: 验证 Python 发布工具
        run: python -B -m unittest discover -s tests/gitlab -v

      - name: 运行完整 Rust 测试
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target $env:RUST_TARGET

  package:
    name: 签名打包
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: upper-signing
    concurrency:
      group: upper-package-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_base_name }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 缓存 NSIS 下载文件
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upper-nsis-downloads
          key: upper-nsis-${{ runner.os }}-${{ hashFiles('scripts/workflow/prepare-nsis.ps1') }}

      - name: 下载并校验 NSIS 打包依赖
        if: github.ref == 'refs/heads/main'
        run: ./scripts/workflow/prepare-nsis.ps1

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: 配置 protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 缓存 Rust 依赖和产物
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: upper-${{ env.RUST_TARGET }}-package
          workspaces: src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: 记录 Rust 缓存命中
        run: Write-Host "Rust 缓存命中=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并冻结平台安装包
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/workflow/build-platform-package.ps1

      - name: 保存冻结安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_base_name }}-${{ github.run_attempt }}
          path: package/platform/
          if-no-files-found: error
          retention-days: 14

      - name: 保存构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/logs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: 发布到平台
    needs: package
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ${{ fromJSON(vars.UPPER_PUBLISH_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: ${{ github.ref_type == 'tag' && 'upper-stable' || 'upper-ci' }}
    concurrency:
      group: upper-platform-${{ github.ref_type == 'tag' && 'stable' || 'ci' }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 下载本次冻结安装包
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: package/platform/

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 准备平台发布依赖
        run: |
          python -m pip install --disable-pip-version-check grpcio==1.84.0 grpcio-tools==1.84.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/gitlab/init_platform_proto.py

      - name: 上传并发布平台通道
        env:
          PLATFORM_GRPC_ENDPOINT: ${{ vars.PLATFORM_GRPC_ENDPOINT }}
          PLATFORM_GRPC_PLAINTEXT: ${{ vars.PLATFORM_GRPC_PLAINTEXT }}
          PLATFORM_GRPC_PUBLIC_PLAINTEXT_ENDPOINT: ${{ vars.PLATFORM_GRPC_PUBLIC_PLAINTEXT_ENDPOINT }}
          PLATFORM_PUBLIC_BASE_URL: ${{ vars.PLATFORM_PUBLIC_BASE_URL }}
          PLATFORM_GRPC_CA_FILE: ${{ vars.PLATFORM_GRPC_CA_FILE }}
          PLATFORM_UPLOAD_TOKEN: ${{ secrets.PLATFORM_UPLOAD_TOKEN }}
        run: python -B scripts/gitlab/platform_client.py --metadata package/platform/upload-metadata.json
