name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RUST_TARGET: x86_64-pc-windows-msvc
  PLATFORM_ID: windows-x64
  CARGO_INCREMENTAL: '0'
  PACKAGE_DIR: package
  R2_BUCKET: ${{ vars.R2_BUCKET || 'mskdsp-update' }}
  R2_PREFIX: ${{ vars.R2_PREFIX || 'mskdsp-upper' }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-19f3d71852b04011b120b1b814141c12.r2.dev' }}
  STATIC_UPDATE_BASE_URL: ${{ format('{0}/mskdsp-upper', vars.R2_PUBLIC_BASE_URL || 'https://pub-19f3d71852b04011b120b1b814141c12.r2.dev') }}

jobs:
  verify-debug:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Cache Rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mskdsp-upper-${{ runner.os }}-${{ env.RUST_TARGET }}-verify
          workspaces: |
            ./src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: Report Rust cache status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Host "Cargo registry cache hit: ${{ steps.rust_cache.outputs.cache-hit }}"

      - name: Prepare package/log directories
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Path package\logs -Force | Out-Null

      - name: Prepare submodule access
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: .\scripts\workflow\Prepare-SubmoduleAccess.ps1

      - name: Sync and update submodules
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status | Tee-Object -FilePath package\logs\git-submodule-status.log

      - name: Install Node dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          npm ci 2>&1 | Tee-Object -FilePath package\logs\npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run workflow helper tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          npm run test:workflow 2>&1 | Tee-Object -FilePath package\logs\workflow-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run lint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          npm run lint 2>&1 | Tee-Object -FilePath package\logs\lint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run cargo tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          CARGO_NET_OFFLINE: ${{ steps.rust_cache.outputs.cache-hit == 'true' && 'true' || '' }}
        run: |
          $ErrorActionPreference = "Continue"
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml --target $env:RUST_TARGET 2>&1 | Tee-Object -FilePath package\logs\cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect diagnostics on failure
        if: failure()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/collect-diagnostics.mjs --channel ci --phase verify

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  package-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_base_name: ${{ steps.metadata.outputs.artifact_base_name }}
      output_dir: ${{ steps.bundle.outputs.output_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Cache Rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mskdsp-upper-${{ runner.os }}-${{ env.RUST_TARGET }}-package
          workspaces: |
            ./src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: Report Rust cache status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Host "Cargo registry cache hit: ${{ steps.rust_cache.outputs.cache-hit }}"

      - name: Prepare package/log directories
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Path package\logs -Force | Out-Null

      - name: Prepare submodule access
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: .\scripts\workflow\Prepare-SubmoduleAccess.ps1

      - name: Sync and update submodules
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status | Tee-Object -FilePath package\logs\git-submodule-status.log

      - name: Install Node dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          npm ci 2>&1 | Tee-Object -FilePath package\logs\npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit build metadata
        id: metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/emit-build-metadata.mjs --channel ci --repository ${{ github.repository }} --ref ${{ github.ref_name }} --sha ${{ github.sha }} --target-triple $env:RUST_TARGET --platform $env:PLATFORM_ID --output package/metadata/ci.json

      - name: Apply channel version
        id: apply_version
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/apply-channel-version.mjs --metadata-file package/metadata/ci.json --backup-dir package/.manifest-backup

      - name: Render release tauri config
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/render-tauri-config.mjs --metadata-file package/metadata/ci.json --output package/generated/tauri.ci.conf.json --endpoint "$env:STATIC_UPDATE_BASE_URL/ci/latest.json" --bundle-targets nsis --updater-artifacts true

      - name: Build release package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          MSKDSP_UPPER_SOURCEMAP: 'true'
          CARGO_NET_OFFLINE: ${{ steps.rust_cache.outputs.cache-hit == 'true' && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          npx tauri build --bundles nsis --target $env:RUST_TARGET --ci --config package/generated/tauri.ci.conf.json 2>&1 | Tee-Object -FilePath package\logs\tauri-release-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage artifacts
        id: stage
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/stage-release.mjs --metadata-file package/metadata/ci.json --build-log package/logs/tauri-release-build.log --submodule-status-file package/logs/git-submodule-status.log --asset-base-url "$env:STATIC_UPDATE_BASE_URL/ci/$env:PLATFORM_ID"

      - name: Create delivery bundle
        id: bundle
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/create-delivery-bundle.mjs --metadata-file package/metadata/ci.json

      - name: Write SHA256 sums
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/write-sha256sums.mjs --metadata-file package/metadata/ci.json --output-dir ${{ steps.bundle.outputs.output_dir }}

      - name: Upload CI package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_base_name }}
          path: ${{ steps.bundle.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Restore manifests
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/restore-manifests.mjs --backup-dir package/.manifest-backup

      - name: Collect diagnostics on failure
        if: failure()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/collect-diagnostics.mjs --channel ci --phase package --metadata-file package/metadata/ci.json --build-log package/logs/tauri-release-build.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-package-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs:
      - verify-debug
      - package-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download CI package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-build.outputs.artifact_base_name }}
          path: ${{ needs.package-build.outputs.output_dir }}

      - name: Verify artifact commit
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $metadataPath = "package/metadata/ci.json"
          if (-not (Test-Path -LiteralPath $metadataPath)) {
            throw "未找到构建元数据，无法校验产物来源: $metadataPath"
          }
          $artifactSha = (Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json).sha
          if ($artifactSha -ne $env:GITHUB_SHA) {
            throw "产物 sha 与当前提交不一致: artifact=$artifactSha current=$env:GITHUB_SHA"
          }
          Write-Host "产物来源校验通过: $artifactSha"

      - name: Setup AWS CLI
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            choco install awscli -y --no-progress
          }
          aws --version

      - name: Sync CI static updater source
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          .\scripts\workflow\Publish-R2StaticUpdater.ps1 `
            -PackageOutputDir "${{ needs.package-build.outputs.output_dir }}" `
            -ChannelPath ci `
            -Platform "$env:PLATFORM_ID"

      - name: Restore manifests
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          node scripts/workflow/restore-manifests.mjs --backup-dir package/.manifest-backup
