name: Upper CI and Platform Release

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rust_test_mode:
        description: Rust 测试模式（baseline 和 opt-level-1 仅验证）
        type: choice
        default: normal
        options:
          - normal
          - baseline
          - opt-level-1
      parallel_package:
        description: 并行编译正式 EXE 并生成签名安装包（仅 main，不发布）
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.2'
  PYTHON_VERSION: '3.13'
  RUST_TARGET: x86_64-pc-windows-msvc
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'

jobs:
  verify:
    name: 验证
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: upper-verify-${{ github.ref }}-${{ inputs.rust_test_mode || 'normal' }}${{ inputs.parallel_package && '-parallel-package' || '' }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 校验发布来源
        if: github.event_name != 'pull_request'
        run: |
          python -B scripts/gitlab/release_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python -B scripts/gitlab/verify_stable_source.py --repository origin --tag $env:GITHUB_REF_NAME --sha $env:GITHUB_SHA
          }

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: 配置 protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 缓存 Rust 依赖和产物
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: upper-${{ env.RUST_TARGET }}-verify
          workspaces: src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: 记录 Rust 缓存命中
        run: Write-Host "Rust 缓存命中=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: 恢复签名测试夹具的原始字节
        run: git restore --source=HEAD --worktree -- src-tauri/testdata/updater/fixture.bin

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端类型并构建
        run: npm run build

      - name: 运行完整 Rust 测试
        env:
          RUST_TEST_MODE: ${{ inputs.rust_test_mode }}
        run: |
          $profileArgs = @()
          if ($env:RUST_TEST_MODE -eq 'opt-level-1') {
            $profileArgs = @('--config', 'profile.release.package.mskdsp-upper.opt-level=1')
          }
          Write-Host "Rust 测试模式：$($env:RUST_TEST_MODE)"
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target $env:RUST_TARGET --timings @profileArgs

      - name: 保存 Rust 验证编译计时
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-verify-cargo-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: 前端与发布工具检查
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: upper-checks-${{ github.ref }}-${{ inputs.rust_test_mode || 'normal' }}${{ inputs.parallel_package && '-parallel-package' || '' }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装前端依赖
        run: npm ci

      - name: 验证工作流脚本
        run: npm run test:workflow

      - name: 运行离线业务测试
        run: npm run test:offline

      - name: 检查前端代码
        run: npm run lint

      - name: 验证 Python 发布工具
        run: python -B -m unittest discover -s tests/gitlab -v

  prebuild:
    name: 编译正式 EXE
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.parallel_package && inputs.rust_test_mode == 'normal')
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: upper-prebuild-${{ github.ref }}${{ inputs.parallel_package && '-parallel-package' || '' }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: 配置 protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 恢复签名打包所用 Rust 缓存
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: upper-${{ env.RUST_TARGET }}-package
          workspaces: src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' }}

      - name: 记录 Rust 缓存命中
        run: Write-Host "Rust 缓存命中=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: 安装前端依赖
        run: npm ci

      - name: 编译并冻结正式 EXE
        run: ./scripts/workflow/build-platform-package.ps1 -Prebuild

      - name: 保存本次正式 EXE
        uses: actions/upload-artifact@v4
        with:
          name: upper-prebuilt-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/prebuilt/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: 保存正式 EXE 编译计时
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-prebuild-cargo-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: 签名打包
    needs: [verify, checks, prebuild]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.checks.result == 'success'
        && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.rust_test_mode == 'normal')
        && (needs.prebuild.result == 'success'
          || needs.prebuild.result == 'skipped' && !inputs.parallel_package
            && (github.event_name != 'push' || github.ref != 'refs/heads/main')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    environment: upper-signing
    concurrency:
      group: upper-package-${{ github.ref }}${{ inputs.parallel_package && '-parallel-package' || '' }}
      cancel-in-progress: true
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_base_name }}-${{ github.run_attempt }}
      prebuilt: ${{ needs.prebuild.result == 'success' && 'true' || 'false' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出源码及设备协议
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: 缓存 NSIS 下载文件
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upper-nsis-downloads
          key: upper-nsis-${{ runner.os }}-${{ hashFiles('scripts/workflow/prepare-nsis.ps1') }}

      - name: 下载并校验 NSIS 打包依赖
        if: github.ref == 'refs/heads/main'
        run: ./scripts/workflow/prepare-nsis.ps1

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: 配置 protoc
        if: needs.prebuild.result != 'success'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: 缓存 Rust 依赖和产物
        if: needs.prebuild.result != 'success'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: upper-${{ env.RUST_TARGET }}-package
          workspaces: src-tauri -> target
          cache-targets: 'true'
          cache-bin: 'false'

      - name: 记录 Rust 缓存命中
        if: needs.prebuild.result != 'success'
        run: Write-Host "Rust 缓存命中=${{ steps.rust-cache.outputs.cache-hit }}"

      - name: 安装前端依赖
        run: npm ci

      - name: 下载本次正式 EXE
        if: needs.prebuild.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: upper-prebuilt-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/prebuilt/

      - name: 构建并冻结平台安装包
        id: build
        env:
          BUNDLE_PREBUILT: ${{ needs.prebuild.result == 'success' && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/workflow/build-platform-package.ps1 -BundlePrebuilt:($env:BUNDLE_PREBUILT -eq 'true')

      - name: 保存冻结安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_base_name }}-${{ github.run_attempt }}
          path: package/platform/
          if-no-files-found: error
          retention-days: 14

      - name: 保存构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: 保存 Rust 打包编译计时
        if: always() && needs.prebuild.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: upper-package-cargo-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  verify_parallel_package:
    name: 验证签名安装包
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.package.outputs.prebuilt == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出更新公钥
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 下载本次签名安装包
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: package/platform/

      - name: 校验 SHA256 和更新签名
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory

          package = Path("package/platform")
          metadata = json.loads((package / "upload-metadata.json").read_text(encoding="utf-8"))
          name = metadata["file_name"]
          if (Path(name).name != name or not name.endswith(".exe")
              or metadata["source_sha"] != os.environ["GITHUB_SHA"]
              or metadata["pipeline_id"] != os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("安装包来源与本次流水线不一致")
          installer = package / name
          with installer.open("rb") as contents:
              if hashlib.file_digest(contents, "sha256").hexdigest() != metadata["sha256"]:
                  raise SystemExit("安装包 SHA256 与发布元数据不一致")
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          signature = installer.with_name(installer.name + ".sig").read_text(encoding="utf-8").strip()
          if signature != metadata["signature"]:
              raise SystemExit("更新签名与发布元数据不一致")
          with TemporaryDirectory() as tmp:
              key = Path(tmp) / "updater.pub"
              sig = Path(tmp) / "installer.minisig"
              key.write_bytes(base64.b64decode(config["plugins"]["updater"]["pubkey"], validate=True))
              sig.write_bytes(base64.b64decode(signature, validate=True))
              subprocess.run(["minisign", "-Vm", str(installer), "-p", str(key), "-x", str(sig)], check=True)
          print(f"安装包版本：{metadata['version']}")
          PY

  publish:
    name: 发布到平台
    needs: [package, verify_parallel_package]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success'
        && (needs.package.outputs.prebuilt == 'true' && needs.verify_parallel_package.result == 'success'
          || needs.package.outputs.prebuilt == 'false' && needs.verify_parallel_package.result == 'skipped')
        && github.event_name != 'pull_request' && !inputs.parallel_package
        && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    runs-on: ${{ fromJSON(vars.UPPER_PUBLISH_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: ${{ github.ref_type == 'tag' && 'upper-stable' || 'upper-ci' }}
    concurrency:
      group: upper-platform-${{ github.ref_type == 'tag' && 'stable' || 'ci' }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 下载本次冻结安装包
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: package/platform/

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 准备平台发布依赖
        run: |
          python -m pip install --disable-pip-version-check grpcio==1.84.0 grpcio-tools==1.84.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/gitlab/init_platform_proto.py

      - name: 上传并发布平台通道
        env:
          PLATFORM_GRPC_ENDPOINT: ${{ vars.PLATFORM_GRPC_ENDPOINT }}
          PLATFORM_GRPC_PLAINTEXT: ${{ vars.PLATFORM_GRPC_PLAINTEXT }}
          PLATFORM_GRPC_PUBLIC_PLAINTEXT_ENDPOINT: ${{ vars.PLATFORM_GRPC_PUBLIC_PLAINTEXT_ENDPOINT }}
          PLATFORM_PUBLIC_BASE_URL: ${{ vars.PLATFORM_PUBLIC_BASE_URL }}
          PLATFORM_GRPC_CA_FILE: ${{ vars.PLATFORM_GRPC_CA_FILE }}
          PLATFORM_UPLOAD_TOKEN: ${{ secrets.PLATFORM_UPLOAD_TOKEN }}
        run: python -B scripts/gitlab/platform_client.py --metadata package/platform/upload-metadata.json
